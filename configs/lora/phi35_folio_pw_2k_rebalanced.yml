model_key: phi35
experiment_name: phi35_lora_folio_pw_2k_rebal

datasets:
  - folio
  - proofwriter

dataset_sample_sizes:
  proofwriter: 2000

lora:
  r: 32
  lora_alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_up_proj, down_proj]
  lora_dropout: 0.3
  bias: none
  task_type: CAUSAL_LM

training:
  num_train_epochs: 10
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-5
  warmup_steps: 50
  max_grad_norm: 1.0
  max_length: 384
  logging_steps: 50
  eval_accumulation_steps: 8
  eval_strategy: epoch
  save_strategy: epoch
  fp16: false
  bf16: true
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  report_to: none
  # Inverse-frequency class weights for FOLIO(851) + PW(2000) training mix.
  # Approximate counts: True=1283, False=1283, Uncertain=283.
  # weight[c] = n_total / (n_classes * count[c])  →  ratio Uncertain:True ≈ 4.5:1
  class_weights:
    Uncertain: 3.36
    "True": 0.74
    "False": 0.74
