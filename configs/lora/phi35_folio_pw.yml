model_key: phi35
experiment_name: phi35_lora_folio_pw

datasets:
  - folio
  - proofwriter

dataset_sample_sizes:
  proofwriter: 2000

lora:
  r: 64
  lora_alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

training:
  num_train_epochs: 5
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  learning_rate: 1.0e-4
  warmup_steps: 100
  max_grad_norm: 1.0
  max_length: 384
  logging_steps: 100
  eval_strategy: epoch
  save_strategy: epoch
  fp16: false
  bf16: false
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  report_to: none
