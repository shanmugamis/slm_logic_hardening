model_key: phi35
experiment_name: phi35_lora_folio

datasets:
  - folio

# Sample sizes for large datasets (omit or set null to use full dataset)
dataset_sample_sizes:
  proofwriter: 10000   # full dataset has 585k

lora:
  r: 64
  lora_alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM

training:
  num_train_epochs: 10
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  learning_rate: 5.0e-5
  warmup_steps: 50
  max_grad_norm: 1.0
  max_length: 384
  logging_steps: 50
  eval_strategy: epoch
  save_strategy: epoch
  fp16: false
  bf16: false
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  report_to: none
